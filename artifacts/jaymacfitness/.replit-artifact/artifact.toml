kind = "web"
previewPath = "/"
title = "JayMacFitness"
version = "1.0.0"
id = "artifacts/jaymacfitness"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20026

[services.development]
run = "pnpm --filter @workspace/jaymacfitness run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/jaymacfitness", "run", "build"]
publicDir = "artifacts/jaymacfitness/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/personal-training-birmingham"
to = "/personal-training-birmingham/index.html"

[[services.production.rewrites]]
from = "/online-coaching"
to = "/online-coaching/index.html"

[[services.production.rewrites]]
from = "/group-training"
to = "/group-training/index.html"

[[services.production.rewrites]]
from = "/outdoor-training"
to = "/outdoor-training/index.html"

[[services.production.rewrites]]
from = "/blog"
to = "/blog/index.html"

[[services.production.rewrites]]
from = "/personal-trainer-kings-heath"
to = "/personal-trainer-kings-heath/index.html"

[[services.production.rewrites]]
from = "/personal-trainer-moseley"
to = "/personal-trainer-moseley/index.html"

[[services.production.rewrites]]
from = "/personal-trainer-edgbaston"
to = "/personal-trainer-edgbaston/index.html"

[[services.production.rewrites]]
from = "/personal-trainer-harborne"
to = "/personal-trainer-harborne/index.html"

[[services.production.rewrites]]
from = "/personal-trainer-selly-oak"
to = "/personal-trainer-selly-oak/index.html"

[[services.production.rewrites]]
from = "/blog/best-personal-trainer-birmingham"
to = "/blog/best-personal-trainer-birmingham/index.html"

[[services.production.rewrites]]
from = "/blog/online-personal-training-cost-uk"
to = "/blog/online-personal-training-cost-uk/index.html"

[[services.production.rewrites]]
from = "/blog/benefits-of-small-group-training"
to = "/blog/benefits-of-small-group-training/index.html"

[[services.production.rewrites]]
from = "/blog/outdoor-personal-training-birmingham-guide"
to = "/blog/outdoor-personal-training-birmingham-guide/index.html"

[[services.production.rewrites]]
from = "/blog/personal-training-vs-online-coaching"
to = "/blog/personal-training-vs-online-coaching/index.html"

[[services.production.rewrites]]
from = "/blog/how-many-personal-training-sessions-per-week"
to = "/blog/how-many-personal-training-sessions-per-week/index.html"

[[services.production.rewrites]]
from = "/about-jay"
to = "/about-jay/index.html"

[[services.production.rewrites]]
from = "/faq"
to = "/faq/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/login"
to = "/login/index.html"

[[services.production.rewrites]]
from = "/register"
to = "/register/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20026"
BASE_PATH = "/"

[[services]]
name = "api"
paths = ["/api"]
localPort = 5050

[services.development]
run = "pnpm --filter @workspace/jaymacfitness run server:dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/jaymacfitness", "run", "prisma:generate"]
run = "pnpm --filter @workspace/jaymacfitness run server:start"

[services.env]
PORT = "5050"
